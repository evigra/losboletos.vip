<script>

const animaciones = [
    'from-up',
    'from-down',
    'from-left',
    'from-right'
  ];

  const observer1 = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        $(entry.target).addClass('visible');
        observer1.unobserve(entry.target); // 🔒 solo una vez
      }
    });
  }, {
    threshold: 0.2
  });

  $('.animar').each(function () {

    // Animación random SOLO UNA VEZ
    const randomAnim =
      animaciones[Math.floor(Math.random() * animaciones.length)];

    // Delay opcional para naturalidad
    const delay = (Math.random() * 0.3).toFixed(2);

    $(this)
      .addClass(randomAnim)
      .css('transition-delay', delay + 's');

    observer1.observe(this);
  });




const audio = document.getElementById("miAudio");
  audio.volume = 0.4;
  let started = false;

  function startMusic() {
    if (!started) {


        audio.muted = false;

      $(document).off("click scroll touchstart mousemove keydown", startMusic);
    }
  }

  $(document).on("click scroll touchstart mousemove keydown", startMusic);



</script>
