
<img src="../.././sitio_web/img/separador.png" width="100%">

<div class="separador_texto separador_animar">
    <div style="display: flex; justify-content: center;">    
        <img src="../.././sitio_web/img/corona.png" width="30%">
    </div>
    <div class="container subtitulo animar">{tipo_evento}</div>
    <div class="container titulo cursiva animar">{nombre_evento}</div>
    <br><br>
    
    <div class="container subtitulo2 animar">{qr}</div>
    <div class="container subtitulo2">{files}</div>
    
</div>

<div class="galeria">
    <div class="stack">
         {fotos} 
    </div>

    <font class="btn prev"></font>
    <font class="btn next"></font>
</div>


<script>
$(function(){

    let fotos = $('.stack img');
    let index = 0;
    let zoom = 1;

    function mostrar(i){
        fotos.removeClass('active');
        fotos.eq(i).addClass('active')
                 .css('transform', `scale(${zoom})`);
    }

    $('.next').click(() => {
        index = (index + 1) % fotos.length;
        zoom = 1;
        mostrar(index);
    });

    $('.prev').click(() => {
        index = (index - 1 + fotos.length) % fotos.length;
        zoom = 1;
        mostrar(index);
    });

    // TOUCH
    let startX, startY;

    $('.stack').on('touchstart', function(e){
        let t = e.originalEvent.touches[0];
        startX = t.clientX;
        startY = t.clientY;
    });

    $('.stack').on('touchend', function(e){
        let t = e.originalEvent.changedTouches[0];
        let dx = t.clientX - startX;
        let dy = t.clientY - startY;

        // Horizontal → cambiar foto
        if(Math.abs(dx) > Math.abs(dy)){
            if(dx < -50) $('.next').click();
            if(dx > 50) $('.prev').click();
        }
        // Vertical → zoom
        else{
            if(dy < -50) zoom += 0.1;   // zoom in
            if(dy > 50) zoom = Math.max(1, zoom - 0.1); // zoom out

            fotos.eq(index)
                 .css('transform', `scale(${zoom})`);
        }
    });

});

const animaciones = [
    'from-up',
    'from-down',
    'from-left',
    'from-right'
  ];

  const observer1 = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        $(entry.target).addClass('visible');
        observer1.unobserve(entry.target); // 🔒 solo una vez
      }
    });
  }, {
    threshold: 0.2
  });

  $('.animar').each(function () {

    // Animación random SOLO UNA VEZ
    const randomAnim =
      animaciones[Math.floor(Math.random() * animaciones.length)];

    // Delay opcional para naturalidad
    const delay = (Math.random() * 0.3).toFixed(2);

    $(this)
      .addClass(randomAnim)
      .css('transition-delay', delay + 's');

    observer1.observe(this);
  });




const audio = document.getElementById("miAudio");
  audio.volume = 0.4;
  let started = false;

  function startMusic() {
    if (!started) {


        audio.muted = false;

      $(document).off("click scroll touchstart mousemove keydown", startMusic);
    }
  }

  $(document).on("click scroll touchstart mousemove keydown", startMusic);



</script>
